plugins {
    id "com.android.application"
}

def configuredSiteUrl = providers.gradleProperty("siteUrl").getOrElse("https://example.com")

android {
    namespace "uz.talimpro.mobile"
    compileSdk 36

    defaultConfig {
        applicationId "uz.talimpro.mobile"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "SITE_URL", "\"${configuredSiteUrl}\""
    }

    buildFeatures {
        buildConfig true
    }
}
