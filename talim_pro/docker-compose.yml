services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: talimpro
      POSTGRES_USER: talimpro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "5432:5432"
    volumes:
      - talimpro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talimpro -d talimpro"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  talimpro_pgdata:
