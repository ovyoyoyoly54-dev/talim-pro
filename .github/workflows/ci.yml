name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: talim_pro

jobs:
  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talimpro
          POSTGRES_USER: talimpro
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talimpro -d talimpro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DJANGO_DEBUG: "True"
      DATABASE_SSL_REQUIRE: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: talim_pro/requirements.txt
      - run: pip install -r requirements.txt
      - name: Point Django at PostgreSQL
        if: matrix.db == 'postgres'
        run: echo "DATABASE_URL=postgresql://talimpro:ci-password@localhost:5432/talimpro" >> "$GITHUB_ENV"
      - name: Django system check
        run: python manage.py check
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test --noinput

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t talim-pro:ci .
